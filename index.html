<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | Product preview card component</title>
</head>
<body class="montserrat-font">
  <main class="card">
      <picture class="card__picture"> <!-- ####### Cambio de imagen condicionado al ancho del dispositivo ####### -->
        <source media="(min-width: 768px)" srcset="./images/image-product-desktop.jpg">
        <img class="card__image" src="./images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum">
      </picture>
      <section class="card__info">
        <p class="card__category gray">Perfume</p>

        <h1 class="card__name big fraunces-font">Gabrielle Essence Eau De Parfum</h1>

        <p class="card__description gray small">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.</p>
        
        <div class="card__price">
          <span class="card__price__current big fraunces-font">$149.99</span>
          <span class="card__price__original gray small"><s>$169.99</s></span>
        </div>

        <button class="card__button small" type="button"><span>Add to Cart</span></button>
      </section>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Sidd López</a>.
  </footer>
</body>
</html>
