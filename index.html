<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <link rel="stylesheet" href="./style.css">
  
  <title>Frontend Mentor | Product preview card component</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 0.6875rem; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body class="montserrat-font">
  <main class="card">
      <picture> <!-- ####### Cambio de imagen condicionado al ancho del dispositivo ####### -->
        <source media="(min-width: 768px)" srcset="./images/image-product-desktop.jpg">
        <img class="card__image" src="./images/image-product-mobile.jpg" alt="Gabrielle Essence Eau De Parfum">
      </picture>
      <section class="card__info">
        <p class="card__category gray">Perfume</p>

        <h1 class="card__name big fraunces-font">Gabrielle Essence Eau De Parfum</h1>

        <p class="card__description gray small">A floral, solar and voluptuous interpretation composed by Olivier Polge, 
        Perfumer-Creator for the House of CHANEL.</p>

        <span class="card__new-price big fraunces-font">$149.99</span>
        <span class="card__old-price gray small"><s>$169.99</s></span>

        <button class="card__button small" type="button"><span>Add to Cart</span></button>
      </section>
  </main>
  
  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </footer>
</body>
</html>
